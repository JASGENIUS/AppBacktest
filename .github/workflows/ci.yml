name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vitest run

      # The real gate: every user-facing feature, end to end, against the
      # bundled example apps. Deterministic and offline — the fixture provider
      # means CI needs no API key and costs nothing.
      - name: verify every feature end to end
        run: node scripts/verify-features.mjs

      # Belt and braces: the demo must still DISCOVER the planted bug. Seed
      # 555001 deterministically double-clicks the upload in runs 1 and 2, so
      # the expected exit code is exactly 2 (two discovered failures). A zero
      # here would mean detection silently broke.
      - name: demo discovers the planted bug
        run: |
          set +e
          node dist/cli/index.js run --config examples/pod-app/appbacktest.yaml --seed 555001
          code=$?
          set -e
          echo "exit code: $code (expected 2 — two discovered failures)"
          test "$code" -eq 2
