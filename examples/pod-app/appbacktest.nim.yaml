# PODHaul demo — live-LLM variant on NVIDIA NIM (free tier).
# Needs NVIDIA_API_KEY in .env (make one at build.nvidia.com).
# nemotron-3-super answers a decision step in ~6s on this endpoint; z-ai/glm-5.2
# also works (heavier reasoner, ~20s/step). Models come and go on NIM —
# on a 404/410, probe GET https://integrate.api.nvidia.com/v1/models.

app:
  name: POD Demo
  url: http://localhost:4173
  command: node server.js
  resetHook: { method: POST, url: /api/reset }

provider:
  type: openai_compatible
  baseUrl: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3-super-120b-a12b
  apiKeyEnv: NVIDIA_API_KEY

personas:
  driver:
    device: desktop
    patience: normal
    doubleClickChance: 0.5
    uploadSizeKB: 400
    traits: ["in a hurry", "not very technical"]

scenarios:
  pod_upload:
    persona: driver
    goal: >
      You are a truck driver. Upload a proof-of-delivery photo for load #38419
      and make sure it was accepted.
    checks:
      - { type: url,  contains: "/loads/" }
      - { type: transient, contains: "Upload received" }
      - { type: http, url: /api/loads/38419/pods, count: 1 }

runs: 1
browser: { headless: true, actionTimeoutMs: 8000 }
