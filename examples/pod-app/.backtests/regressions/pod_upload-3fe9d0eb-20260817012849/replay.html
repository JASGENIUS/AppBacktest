<script>
const DATA = {"entries":[{"atMs":487,"kind":"action","stepIndex":0,"label":"clicked “Load #38419 — Chicago, IL → Detroit, MI (in transit)”","screenshot":"steps/000.png","severity":"info","shot":"steps/000.png"},{"atMs":601,"kind":"action","stepIndex":1,"label":"attached a file “Choose photo”","screenshot":"steps/001.png","severity":"info","shot":"steps/001.png"},{"atMs":1093,"kind":"action","stepIndex":2,"label":"typed “Delivered to dock 4” into “Delivery notes”","screenshot":"steps/002.png","severity":"info","shot":"steps/002.png"},{"atMs":1093,"kind":"transient","stepIndex":1,"label":"app showed: “file chosen: upload.png”","severity":"info","shot":"steps/002.png"},{"atMs":1141,"kind":"action","stepIndex":3,"label":"clicked “Upload POD”","screenshot":"steps/003.png","detail":"perturbation: double_click","severity":"info","shot":"steps/003.png"},{"atMs":1484,"kind":"action","stepIndex":4,"label":"waited 1500ms","screenshot":"steps/004.png","severity":"info","shot":"steps/004.png"},{"atMs":1876,"kind":"transient","stepIndex":4,"label":"app showed: “Upload received”","severity":"info","shot":"steps/004.png"},{"atMs":3025,"kind":"action","stepIndex":5,"label":"finished — believed success: Uploaded the POD photo and saw the confirmation message.","screenshot":"steps/005.png","severity":"info","shot":"steps/005.png"}],"markers":[{"id":"08ce819c621f","title":"Application reported success but state disagrees (pod_upload)","atMs":3025,"severity":"critical"}]};
const KIND_COLOR = {"action":"#7dd3fc","network":"#fca5a5","console":"#fdba74","transient":"#86efac","dialog":"#c4b5fd","error":"#f87171","navigation":"#94a3b8","finding":"#f472b6"};
const side = document.getElementById("side");
const shotbox = document.getElementById("shotbox");
const nowEl = document.getElementById("now");
const whatEl = document.getElementById("what");
let index = 0, timer = null;

function fmt(ms){const s=Math.max(0,Math.round(ms));const m=Math.floor(s/60000);const sec=Math.floor((s%60000)/1000);
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(s%1000).padStart(3,"0");}

DATA.entries.forEach((e,i)=>{
  const row=document.createElement("div");
  row.className="row"+(e.kind==="finding"?" finding":"");
  row.dataset.i=i;
  const color=KIND_COLOR[e.kind]||"#8b95a7";
  row.innerHTML='<div class="t">'+fmt(e.atMs)+'</div><div><div class="label">'+
    '<span class="dot" style="background:'+color+'"></span>'+
    e.label.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</div>'+
    (e.detail?'<div class="detail">'+e.detail.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</div>':'')+'</div>';
  row.addEventListener("click",()=>show(i));
  side.appendChild(row);
});

function show(i){
  index=Math.max(0,Math.min(i,DATA.entries.length-1));
  const e=DATA.entries[index];
  nowEl.textContent=fmt(e.atMs);
  whatEl.textContent=e.label;
  shotbox.innerHTML = e.shot
    ? '<img class="shot" src="'+e.shot+'" alt="screen at '+fmt(e.atMs)+'">'
    : '<div class="shot-empty">no screenshot captured at this moment</div>';
  [...side.children].forEach((r,j)=>r.classList.toggle("active",j===index));
  const active=side.children[index];
  if(active) active.scrollIntoView({block:"nearest"});
}
function seekTo(ms){
  let best=0;
  DATA.entries.forEach((e,i)=>{ if(e.atMs<=ms) best=i; });
  show(best);
}
document.getElementById("prev").onclick=()=>show(index-1);
document.getElementById("next").onclick=()=>show(index+1);
document.getElementById("play").onclick=function(){
  if(timer){clearInterval(timer);timer=null;this.textContent="▶ play";return;}
  this.textContent="⏸ pause";
  timer=setInterval(()=>{ if(index>=DATA.entries.length-1){clearInterval(timer);timer=null;
    document.getElementById("play").textContent="▶ play";return;} show(index+1); },900);
};
document.querySelectorAll(".fpill").forEach(p=>p.addEventListener("click",()=>seekTo(Number(p.dataset.at))));
addEventListener("keydown",e=>{ if(e.key==="ArrowRight")show(index+1); if(e.key==="ArrowLeft")show(index-1); });
if(location.hash.startsWith("#t=")) seekTo(Number(location.hash.slice(3))); else show(0);
